# ============================================================
#  104 職缺爬蟲設定檔
#  修改後重新執行 / 推上 GitHub 即生效
# ============================================================

search:
  keywords:
    - SDET
    - QA
    - 軟體測試
    - 軟體測試工程師
    - 測試工程師
    - 自動化測試
    - 自動化測試工程師
    - 軟體品質保證
    - 軟體品質保證工程師
    - 品檢軟體工程師
    

  areas:
    - 台北市
    - 新北市
    - 桃園市
    - 新竹市
    - 新竹縣

  # 每個關鍵字最多抓幾頁（每頁約 40 筆）
  max_pages: 3

  # true = 只顯示今日更新職缺；false = 顯示全部搜尋結果
  today_only: true

notification:
  email:
    enabled: true
    # daily = 每次爬蟲跑完都寄；weekly = 每週固定一天寄「過去 7 天彙整」
    frequency: weekly
    # ISO 星期幾（1=一 2=二 3=三 4=四 5=五 6=六 7=日），frequency: weekly 時才生效
    weekday: 5
    # 收件人清單（可多個）
    recipients:
      - owen901031@gmail.com

  telegram:
    enabled: true
    # 目前固定每天發送（跟爬蟲同步），僅含當天新職缺
    # Bot Token 與 Chat ID 請設定在 .env 或 GitHub Secrets
    # TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
